name: Compilar atualização do Lex
on:
  push:
    branches: [compilacao-perfil-lex]
    paths: [.github/workflows/compilar-perfil.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build:public
      - name: Exportar os arquivos estáticos públicos
        run: |
          for file in dist-public/index.html dist-public/sw.js dist-public/assets/index-*.js dist-public/assets/index-*.css; do
            printf 'LEX-FILE %s %s\n' "${file#dist-public/}" "$(git hash-object "$file")"
            base64 -w 4096 "$file" | sed 's/^/LEX-DATA /'
            printf '\n'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lex-publico
          retention-days: 1
          path: |
            dist-public/index.html
            dist-public/sw.js
            dist-public/assets/index-*.js
            dist-public/assets/index-*.css
